<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="390" viewBox="0 0 1180 390" role="img" aria-labelledby="title desc">
<title id="title">ZeroHour engineering terminal</title>
<desc id="desc">An animated, illustrative terminal describing the engineer's development principles. This is not a live operational status report.</desc>
<defs>
<linearGradient id="terminalbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f1b"/><stop offset="1" stop-color="#14253a"/></linearGradient>
<pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 5H6" stroke="#84b9d4" stroke-opacity=".028"/></pattern>
</defs>
<rect width="1180" height="390" rx="20" fill="url(#terminalbg)"/>
<rect width="1180" height="390" rx="20" fill="url(#scan)"/>
<rect x="1" y="1" width="1178" height="388" rx="19" fill="none" stroke="#3c5f79" stroke-width="2"/>
<path d="M1 48H1179" stroke="#354e67"/>
<path d="M20 1H1160Q1179 1 1179 20V47H1V20Q1 1 20 1Z" fill="#1c2b42"/>
<circle cx="28" cy="25" r="7" fill="#ed7180"/><circle cx="52" cy="25" r="7" fill="#efc469"/><circle cx="76" cy="25" r="7" fill="#59cfaa"/>
<text x="120" y="32" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#b8cee7">zero@zerohour:~/portfolio — bash</text>
<text x="1090" y="31" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#79bce3">DEMO</text>
<g font-family="DejaVu Sans Mono, monospace" font-size="19">
<g opacity="1"><animate attributeName="opacity" values="0;1;1;1;1;1" keyTimes="0;0.05;0.24;0.55;0.82;1" dur="16s" repeatCount="indefinite"/>
<text x="34" y="91" fill="#70e2bc">$ whoami</text><text x="34" y="123" fill="#e5f3ff">Backend Engineer  /  AI Integration  /  Automation</text>
</g>
<g opacity="1"><animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.23;0.28;0.55;0.82;1" dur="16s" repeatCount="indefinite"/>
<text x="34" y="171" fill="#70e2bc">$ cat engineering-principles.md</text><text x="34" y="204" fill="#c5d8ef">Build real workflows. Prefer reliability over complexity.</text>
</g>
<g opacity="1"><animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.23;0.52;0.57;0.82;1" dur="16s" repeatCount="indefinite"/>
<text x="34" y="252" fill="#70e2bc">$ ./release-gates --policy</text><text x="34" y="283" fill="#c5d8ef">Review  →  CI  →  evidence  →  owner approval  →  release</text>
</g>
<g opacity="1"><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.23;0.52;0.78;0.84;1" dur="16s" repeatCount="indefinite"/>
<text x="34" y="331" fill="#70e2bc">$ echo $MISSION</text><text x="34" y="362" fill="#80cfff">Ship reliable systems. Verify real user journeys.</text>
<rect x="646" y="345" width="13" height="21" fill="#78eac7"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
</g>
</svg>